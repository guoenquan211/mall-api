<svg xmlns="http://www.w3.org/2000/svg" width="220" height="48" viewBox="0 0 220 48" fill="none" role="img" aria-label="CocoBrite">
  <defs>
    <linearGradient id="cbMonogramFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5C4033"/>
      <stop offset="1" stop-color="#3A261E"/>
    </linearGradient>
  </defs>
  <!-- 高对比：深底 + 浅色字，小尺寸仍可辨认「CB」 -->
  <rect x="2" y="4" width="40" height="40" rx="11" fill="url(#cbMonogramFill)"/>
  <text x="22" y="31" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#FDF6ED" letter-spacing="-0.08em">CB</text>
  <text x="50" y="30" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="700" fill="#2D1F1A" letter-spacing="0.04em">CocoBrite</text>
  <text x="50" y="42" font-family="system-ui, sans-serif" font-size="7" fill="#8B7355" letter-spacing="0.28em">BODY CARE</text>
</svg>
